# Configuration Ruff — identique en local et en CI.
# On garde le socle « pycodestyle + pyflakes + imports » ; les règles B008
# (Depends/Security en valeur par défaut) sont volontairement exclues :
# c'est le style idiomatique de FastAPI, pas une erreur.

line-length = 100
target-version = "py313"

[lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
